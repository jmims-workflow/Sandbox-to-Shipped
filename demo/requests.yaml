  - id: r-1043
    title: Fill in proposal pricing from deal notes
    task: >-
      Read my deal notes and fill in the pricing table in our proposal
      template, including seat counts, discounts and payment terms.
    team: Sales
    how_often: few_week
    who_uses: several_teams
    info: [customer_contact, deal_pricing]
    security_answers: {sends_without_check: "no", keeps_elsewhere: "not_sure", ai_service: claude}
    requester_name: Carlos Mendes
    submitted_at: 147 days ago
    status: decided
    timeline:
      - {label: Submitted, date: 147 days ago}
      - {label: Reviewer picked it up, date: 145 days ago}
      - {label: Security screening done, date: 140 days ago}
      - {label: Decided, date: 137 days ago}
    decision:
      outcome: approve_with_limits
      limits: Prices come from the price sheet, never typed in by hand.
      checklist:
        already_exists: "no"
        sends_without_check: "no"
        uses_customer_details: "yes"
        security_check: done
      reason: >-
        Approved with one limit. Drafting proposals from deal notes saves real
        time, but a wrong price in a proposal is hard to take back. The tool
        pulls every price from the price sheet instead of reading numbers from
        your notes.
      what_would_change: >-
        If the price sheet gets an approved way to record custom discounts, we
        can look at letting the tool fill those in too.
      reason_drafted_by_claude: true
      reason_edited: true
      decided_by: Jordan Ellis
      decided_at: 137 days ago

