  - id: r-1044
    title: Reply to inbound demo requests automatically
    task: >-
      When someone fills in the demo request form, reply right away with times
      that work and a short intro to FlowOS.
    team: Sales
    how_often: every_day
    who_uses: several_teams
    info: [customer_contact]
    extra: Right now replies can take a day, and we lose people in that gap.
    security_answers: {sends_without_check: "yes", keeps_elsewhere: "no", ai_service: claude}
    requester_name: Priya Raman
    submitted_at: 13 days ago
    status: decided
    questions:
      - text: >-
          Could the version that drafts the reply also suggest meeting times
          from the rep's calendar? That's the slowest part for us.
        date: 4 days ago
    timeline:
      - {label: Submitted, date: 13 days ago}
      - {label: Reviewer picked it up, date: 12 days ago}
      - {label: Security screening done, date: 9 days ago}
      - {label: Decided, date: 6 days ago}
    decision:
      outcome: not_approved
      checklist:
        already_exists: "no"
        sends_without_check: "yes"
        uses_customer_details: "yes"
        security_check: done
      reason: >-
        This would send emails to prospects without a person reading them
        first, and it would use contact details from our inbound form. We
        don't approve tools that send to customers on their own.
      what_would_change: >-
        A version that drafts the reply for a rep to check and send would
        likely be approved. It could build on Call Recap Writer, which is
        already approved for customer details.
      reason_drafted_by_claude: true
      reason_edited: true
      decided_by: the AI review group
      decided_at: 6 days ago

