[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-to-shipped"
version = "0.1.0"
description = "Sandbox to Shipped: one front door for AI tool requests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.22",
  "anthropic>=2.0",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sts = "sts.cli:app"

[tool.setuptools]
packages = ["sts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
